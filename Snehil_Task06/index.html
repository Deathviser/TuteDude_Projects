<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. Container Setup -->
  <div class="container">

    <!-- 2. Left Section: image -->
    <div class="left-section">
      <img src="asset/washer.jpg" alt="Washing machine">
    </div>

    <!-- 3. Form Section -->
    <div class="form-section">
      <form class="login-form">

        <!-- 4. Form Heading and Description -->
        <h1>Hello Again!</h1>
        <p class="description">Welcome back! we missed you!</p>

        <!-- 5. Email and Password Inputs -->
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Emailid@site.com">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password">

        <a href="#" class="forgot">Forgot Password</a>

        <!-- 6. Login Button -->
        <button type="submit" class="login-btn">Login</button>

        <p class="register">Not a member? <a href="#">Register Now</a></p>
      </form>
    </div>

  </div>

</body>
</html>
